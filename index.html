<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-app">

        <h1>Weather App</h1>
        <p class="subtitle">Check the current temperature anywhere</p>

        <div class="search-box">
            <input
                type="text"
                id="locationInput"
                placeholder="Enter city e.g. London"
            >

            <button id="searchButton">
                Search
            </button>
        </div>

        <p id="errorMessage" class="error"></p>

        <div id="weatherCard" class="weather-card hidden">

            <div class="location">
                <h2 id="cityName">London</h2>
                <p id="countryName">United Kingdom</p>
            </div>

            <img id="weatherIcon" src="" alt="Weather icon">

            <div class="temperature">
                <span id="temperature">--</span>
                <span>°C</span>
            </div>

            <p id="condition" class="condition">
                --
            </p>

            <div class="details">

                <div class="detail">
                    <span>Feels like</span>
                    <strong id="feelsLike">--°C</strong>
                </div>

                <div class="detail">
                    <span>Humidity</span>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail">
                    <span>Wind</span>
                    <strong id="wind">-- km/h</strong>
                </div>

            </div>

            <p class="updated">
                Last updated: <span id="lastUpdated">--</span>
            </p>

        </div>

    </div>

    <script src="script.js"></script>
</body>
